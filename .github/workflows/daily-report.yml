name: 每日 RS 報告

# 觸發：先以 workflow_dispatch 手動驗證；穩定後由 scripts/cron-trigger/ 的
# Cloudflare Worker 準點打（價格報告 16:30、籌碼報告 23:00）。
# 不用 on:schedule —— GitHub 排程實測延遲 2~4 小時，見 daily-sync.yml 的說明。
on:
  workflow_dispatch:
    inputs:
      kind:
        description: '報告種類'
        required: true
        default: 'price'
        type: choice
        options: [price, chip]
      no_mail:
        description: '只產 PDF 不寄信（產物可從 Artifacts 下載）'
        required: false
        default: false
        type: boolean
      force:
        description: '非交易日或資料過期仍強制產出（測試用）'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-report-${{ github.event.inputs.kind }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 安裝 Python 與中文字型
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 中文字型（缺這個 PDF 內中文會變空白方框）
        # 2026-11-11 連續失敗：apt-get update 只要有一個套件來源壞掉就整個回非零，連帶裝不了字型。
        # 改成 update 失敗也照樣嘗試安裝；apt 仍裝不起來就直接從 Google 官方 noto-cjk repo 下載同一套
        # 繁中字型（家族名同為 Noto Sans CJK TC，report_price.py 的 FONT 照樣找得到）。最後用 fc-list 驗證。
        run: |
          sudo apt-get update -qq || echo "::warning::apt-get update 有錯誤，仍嘗試安裝字型"
          if ! sudo apt-get install -y -qq fonts-noto-cjk; then
            echo "::warning::apt 安裝 fonts-noto-cjk 失敗，改從 GitHub 下載 Noto Sans CJK TC"
            mkdir -p ~/.local/share/fonts
            for w in Regular Bold; do
              curl -sSfL --retry 3 --retry-delay 10 -o ~/.local/share/fonts/NotoSansCJKtc-$w.otf \
                "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-$w.otf"
            done
            fc-cache -f ~/.local/share/fonts
          fi
          # 不用 fc-list | grep -q：Actions 預設 pipefail，grep 提早結束會讓 fc-list 收到 SIGPIPE 而誤判失敗
          N=$(fc-list | grep -c "Noto Sans CJK TC" || true)
          if [ "${N:-0}" -eq 0 ]; then echo "::error::找不到 Noto Sans CJK TC 字型"; exit 1; fi
          echo "中文字型就緒：$N 個字型檔"
      - run: pip install -r scripts/daily-report/requirements.txt

      # 法說會快照：判定「今日新增」要跟先前的清單比對，觀測站本身沒有申報日期。
      # key 每次唯一、restore-keys 取最近一份；cache 7 天沒被讀才會被清，每日跑不會過期
      - name: 還原法說會快照
        uses: actions/cache/restore@v4
        with:
          path: scripts/daily-report/_state
          key: conf-state-${{ github.run_id }}
          restore-keys: conf-state-

      - name: 產出報告並寄信
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          # 用 if 而非 `[ ... ] && ...`：GitHub 的 run: 預設帶 -e，
          # AND-list 在條件為 false 時整句回非零，位置一變就會讓步驟莫名失敗。
          # 手動測試時兩個旗標都是 true 所以沒暴露，排程觸發時才會是 false。
          ARGS="--kind ${{ github.event.inputs.kind }}"
          if [ "${{ github.event.inputs.no_mail }}" = "true" ]; then ARGS="$ARGS --no-mail"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "== python3 scripts/daily-report/run.py $ARGS =="
          python3 scripts/daily-report/run.py $ARGS

      - name: 保存法說會快照
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/daily-report/_state
          key: conf-state-${{ github.run_id }}

      - name: 保留 PDF 供下載
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs-report-${{ github.event.inputs.kind }}
          path: scripts/daily-report/_out/*.pdf
          if-no-files-found: ignore
          retention-days: 14
