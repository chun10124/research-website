name: 每日追蹤表自動同步

# 觸發改由 Cloudflare Worker（scripts/cron-trigger/）準點打 workflow_dispatch。
# 原本的 on:schedule 已移除：GitHub 排程觸發實測會被延遲 2~4 小時（連凌晨低載時段也照樣延，
# 非挑時間問題），且若與 Worker 並存，延遲的排程每天會重複再跑一次 RS、對 Yahoo 全市場多打一輪。
# 排程時間與各時段對應 mode 見 scripts/cron-trigger/wrangler.toml 與 README.md。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: true
        default: 'DRY'
        type: choice
        options:
          - DRY
          - rsThenPrice   # 15:37 場：同一 run 內依序 rs → priceVolume
          - rs
          - priceVolume
          - holdingsRevenue
          - futuresChips  # 籌碼頁：期交所期貨／選擇權籌碼一年份預算 → ibdRsMeta/futuresChips
      limit:
        description: '限制檔數（0=全部，測試可填 3）'
        required: false
        default: '0'

# 避免兩個排程或手動觸發同時跑、互相覆寫
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # actions: write —— 下方「補派富邦收盤 K 棒」要用 GITHUB_TOKEN 派 fubon-fetch.yml
    permissions:
      contents: read
      actions: write
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安裝相依套件
        run: npm ci

      - name: 打包同步腳本
        run: |
          npx --yes esbuild scripts/daily-sync/sync-entry.mjs \
            --bundle --platform=node --format=esm --packages=external \
            --alias:@docusaurus/ExecutionEnvironment=./scripts/daily-sync/docusaurus-execenv-stub.mjs \
            --outfile=scripts/daily-sync/_bundle.mjs

      # 富邦收盤 K 棒由 Worker 13:36／13:50 派 closeBars，但 CF cron 偶爾整段漏觸發
      # （10/27 台灣 13:15–14:00 幾乎停擺，兩場都沒派到）。RS 前再確認一次，缺就補派並等它寫入；
      # closeBars 平常 30 秒內完成，等 4 分鐘還沒有就放棄，RS 照跑（退回全走 Yahoo，只是較慢）。
      # 假日補派也無害：富邦快照非今日時腳本自己 exit 0、不寫入。
      - name: 補派富邦收盤 K 棒（缺才派）
        if: github.event.inputs.mode == 'rsThenPrice' || github.event.inputs.mode == 'rs'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Taipei date +%u)" -ge 6 ]; then echo "週末，略過"; exit 0; fi
          D=$(TZ=Asia/Taipei date +%Y%m%d)
          URL="https://firestore.googleapis.com/v1/projects/my-tools-1228/databases/(default)/documents/ibdRsMeta/fubonCloseBars_${D}?mask.fieldPaths=date"
          has() { [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ]; }
          if has; then echo "富邦收盤 K 棒 ${D} 已存在"; exit 0; fi
          echo "::warning::富邦收盤 K 棒 ${D} 不存在（13:36／13:50 可能沒派到），補派 closeBars"
          gh workflow run fubon-fetch.yml --repo "$GITHUB_REPOSITORY" --ref main -f job=closeBars
          for i in $(seq 1 16); do
            sleep 15
            if has; then echo "富邦收盤 K 棒已寫入（約 $((i * 15)) 秒）"; exit 0; fi
          done
          echo "::warning::等 4 分鐘仍無富邦收盤 K 棒，RS 改全走 Yahoo"

      - name: 執行同步
        run: |
          B=scripts/daily-sync/_bundle.mjs
          MODE="${{ github.event.inputs.mode }}"
          LIMIT="${{ github.event.inputs.limit }}"
          echo "== mode=$MODE limit=$LIMIT =="
          if [ "$MODE" = "rsThenPrice" ]; then
            # 15:37 場：先 RS 全市場，再追蹤表價量（優先沿用 RS priceMap，沿用不到會自己抓 Yahoo）。
            # RS 失敗不可中斷 priceVolume：兩者非硬相依，priceVolume 有 Yahoo fallback
            # （stockApi.js 內 RS priceMap 不夠新即重抓）。中斷只會讓追蹤表白白連坐。
            RS_FAILED=0
            SYNC_MODE=rs SYNC_LIMIT="$LIMIT" node "$B" || RS_FAILED=1
            if [ "$RS_FAILED" = "1" ]; then
              echo "::warning::RS 同步失敗，仍續跑追蹤表價量（沿用不到 RS priceMap，將改抓 Yahoo、較慢）"
            fi
            SYNC_MODE=priceVolume SYNC_LIMIT="$LIMIT" node "$B"
            # priceVolume 成功也要讓 job 標紅，否則 RS 失敗會被吃掉沒人發現
            if [ "$RS_FAILED" = "1" ]; then
              echo "::error::RS 同步失敗（追蹤表價量已續跑完成），請檢視上方 [rs] 日誌"
              exit 1
            fi
          else
            SYNC_MODE="$MODE" SYNC_LIMIT="$LIMIT" node "$B"
          fi
