name: 每日追蹤表自動同步

# 排程時間為 UTC；台灣 = UTC+8
#   台灣 15:37 → UTC 07:37（RS 全市場 + 追蹤表價量，Yahoo）
#   台灣 20:37 → UTC 12:37（三大法人 20:00 更新後就抓；外資持股 21:00 未到，留待 21:37 場次補上）
#   台灣 21:37 → UTC 13:37（外資持股/營收；此時法人已於 20:37 抓畢、會自動判定新鮮而略過，只補持股）
# 分鐘用 :37 而非 :00/:30：GitHub 官方建議避開整點/半點壅塞時段，降低排程被延遲或跳過的機率
# 1-5 = 週一到週五（台股交易日；國定假日仍會跑，抓不到新資料但無害）
on:
  schedule:
    - cron: '37 7 * * 1-5'
    - cron: '37 12 * * 1-5'
    - cron: '37 13 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: true
        default: 'DRY'
        type: choice
        options:
          - DRY
          - rs
          - priceVolume
          - holdingsRevenue
      limit:
        description: '限制檔數（0=全部，測試可填 3）'
        required: false
        default: '0'

# 避免兩個排程或手動觸發同時跑、互相覆寫
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安裝相依套件
        run: npm ci

      - name: 打包同步腳本
        run: |
          npx --yes esbuild scripts/daily-sync/sync-entry.mjs \
            --bundle --platform=node --format=esm --packages=external \
            --alias:@docusaurus/ExecutionEnvironment=./scripts/daily-sync/docusaurus-execenv-stub.mjs \
            --outfile=scripts/daily-sync/_bundle.mjs

      - name: 執行同步
        run: |
          B=scripts/daily-sync/_bundle.mjs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "== 手動觸發：mode=${{ github.event.inputs.mode }} limit=${{ github.event.inputs.limit }} =="
            SYNC_MODE="${{ github.event.inputs.mode }}" SYNC_LIMIT="${{ github.event.inputs.limit }}" node "$B"
          elif [ "${{ github.event.schedule }}" = "37 7 * * 1-5" ]; then
            echo "== 15:37 時段：先 RS 全市場，再追蹤表價量（沿用 RS、不重抓 Yahoo）=="
            SYNC_MODE=rs node "$B"
            SYNC_MODE=priceVolume node "$B"
          else
            echo "== 籌碼時段（schedule=${{ github.event.schedule }}，台灣 20:37 法人／21:37 外資持股）：追蹤表籌碼/外資/營收 =="
            SYNC_MODE=holdingsRevenue node "$B"
          fi
