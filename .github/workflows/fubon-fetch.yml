# 富邦新一代 API 抓取（由 Cloudflare Worker research-daily-sync-trigger 準點 workflow_dispatch）
#   token      登入取行情 token → 推給即時報價 Worker（盤前＋盤中）
#   closeBars  全市場收盤 K 棒＋加權指數 → Firestore（收盤後；RS 同步優先用）
#   inst       追蹤表三大法人 → Firestore（傍晚；每日同步優先用，省 FinMind 配額）
#
# 安全：此 workflow 刻意與 daily-sync 分開——不跑 npm ci、只裝富邦官方 SDK，
# 富邦 secrets 不會出現在安裝大量第三方套件的 job 裡。Action 一律鎖 commit SHA。
# secrets：FUBON_ID、FUBON_API_KEY（Secret Key，只開行情權限）、FUBON_CERT_B64、QUOTE_PUSH_SECRET
name: fubon-fetch

on:
  workflow_dispatch:
    inputs:
      job:
        description: '工作'
        required: true
        type: choice
        options: [token, closeBars, inst]

permissions:
  contents: read

concurrency:
  group: fubon-${{ github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 只需 3 支腳本：直接抓本次 commit 的版本（不用 checkout——repo 內殘留的
      # .claude/worktrees gitlink 會讓 checkout 失敗，也少一個第三方 Action）
      - name: 取得腳本（本次 commit）
        run: |
          mkdir -p temp_scripts
          for f in fubon_token_push fubon_close_bars fubon_inst; do
            curl -sSfL -o "temp_scripts/20261020_${f}_tmp.py" \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/temp_scripts/20261020_${f}_tmp.py"
          done
          ls -la temp_scripts

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5（鎖 SHA）
        with:
          python-version: "3.12"

      # SDK zip 存 GitHub 快取：官方下載點偶爾連不上（11/2 19:45 連線逾時 5 分鐘 → 整場失敗），
      # 有快取就不碰官網；快取被清（7 天沒用）才重下，並重試。換 SDK 版本時要一起改 key、網址、SHA256。
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0（鎖 SHA）
        with:
          path: ~/fubon_sdk
          key: fubon-neo-2.4.0-manylinux-x86_64

      - name: 安裝富邦 SDK（Linux x86_64，快取或官方下載點）
        run: |
          SDK_ZIP=~/fubon_sdk/sdk.zip
          if [ ! -f "$SDK_ZIP" ]; then
            mkdir -p ~/fubon_sdk
            curl -sSfL --retry 4 --retry-all-errors --retry-delay 15 --connect-timeout 20 --max-time 120 \
              -o "$SDK_ZIP" https://www.fbs.com.tw/TradeAPI_SDK/fubon_binary/fubon_neo-2.4.0-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.zip
          else
            echo "使用快取的 SDK"
          fi
          # 核對檔案沒被換過（快取或官網皆然）；不符就刪掉，避免壞檔被存進快取
          echo "516cbf57a822c8cb5809186d84964faa900e43cd1c9704634c60cf0810256b6d  $SDK_ZIP" | sha256sum -c - || { rm -f "$SDK_ZIP"; exit 1; }
          unzip -q "$SDK_ZIP" -d "$RUNNER_TEMP/sdk"
          pip install -q "$RUNNER_TEMP"/sdk/*.whl requests

      # 憑證只在這一步還原、用完即刪
      - name: 執行 ${{ github.event.inputs.job }}
        env:
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_B64: ${{ secrets.FUBON_CERT_B64 }}
          QUOTE_PUSH_SECRET: ${{ secrets.QUOTE_PUSH_SECRET }}
          JOB: ${{ github.event.inputs.job }}
        run: |
          umask 077
          export FUBON_CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$FUBON_CERT_B64" | base64 -d > "$FUBON_CERT_PATH"
          trap 'rm -f "$FUBON_CERT_PATH"' EXIT
          case "$JOB" in
            token)     python temp_scripts/20261020_fubon_token_push_tmp.py ;;
            closeBars) python temp_scripts/20261020_fubon_close_bars_tmp.py --write ;;
            inst)      python temp_scripts/20261020_fubon_inst_tmp.py --write ;;
            *) echo "未知工作 $JOB"; exit 1 ;;
          esac
