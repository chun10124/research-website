name = "research-daily-sync-trigger"
main = "worker.js"
compatibility_date = "2025-01-01"

# Cron 時間一律 UTC（台灣 = UTC+8）。內容與原 daily-sync.yml 的 schedule 相同，
# 差別在「這裡會準點觸發」——GitHub 自家的 on:schedule 會被延遲 2~4 小時，改由本
# Worker 用 workflow_dispatch 打過去（手動觸發不被降級，數秒內開跑）。
#   07:37 UTC = 台灣 15:37 → RS 全市場 + 追蹤表價量
#   12:37 UTC = 台灣 20:37 → 三大法人（外資持股 21:00 未到，留待下一場）
#   13:37 UTC = 台灣 21:37 → 外資持股／營收（法人已抓畢、自動判定新鮮略過）
# 1-5 = 週一到週五；台灣國定假日仍會觸發，但抓不到新資料、無害。
[triggers]
crons = ["37 7 * * 1-5", "37 12 * * 1-5", "37 13 * * 1-5"]

# 非機密設定（CF 後台明文可見，OK）
[vars]
GH_OWNER = "chun10124"
GH_REPO = "research-website"
GH_WORKFLOW = "daily-sync.yml"
GH_REF = "main"

# 機密改用 secret，不寫在這裡：
#   npx wrangler secret put GH_PAT        # 必填：fine-grained PAT（只授權本 repo、Actions 讀寫）
#   npx wrangler secret put TRIGGER_KEY   # 選填：開啟手動測試端點才需要
